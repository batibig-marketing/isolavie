<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 400" font-family="'Fraunces', 'Fredoka', 'Comic Sans MS', sans-serif">
  <defs>
    <style>
      .brand-letter { font-weight: 700; font-size: 220px; font-family: 'Fredoka', 'Nunito', 'Comic Sans MS', sans-serif; }
    </style>
  </defs>
  <!-- Orange arc (smile) -->
  <path d="M 205 145 Q 400 -80 620 145" fill="none" stroke="#F5A623" stroke-width="20" stroke-linecap="round"/>

  <!-- Colored horizontal bars -->
  <rect x="45" y="290" width="130" height="18" rx="9" fill="#2AB2E7"/>
  <rect x="185" y="290" width="130" height="18" rx="9" fill="#F5D82A"/>
  <rect x="325" y="290" width="130" height="18" rx="9" fill="#E71E76"/>
  <rect x="465" y="290" width="130" height="18" rx="9" fill="#8CC432"/>

  <!-- "isolavie" wordmark -->
  <g class="brand-letter">
    <text x="42" y="260" fill="#B32020">i</text>
    <text x="92" y="260" fill="#B32020">s</text>
    <text x="180" y="260" fill="#F5A623">o</text>
    <text x="290" y="260" fill="#B32020">l</text>
    <text x="335" y="260" fill="#B32020">a</text>
    <text x="440" y="260" fill="#F5A623">v</text>
    <text x="540" y="260" fill="#F5A623">i</text>
    <text x="585" y="260" fill="#F5A623">e</text>
  </g>

  <!-- Tagline -->
  <text x="345" y="360" font-size="30" font-weight="600" fill="#8B2020" text-anchor="middle" letter-spacing="2" font-family="'Inter', sans-serif">
    <tspan>P</tspan><tspan font-size="24">OUR FAIRE DES</tspan><tspan font-weight="700"> ÉCONOMIES </tspan><tspan font-weight="700">DURABLES</tspan>
  </text>
</svg>
